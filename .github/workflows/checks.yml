name: Android checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build debug and unsigned tester APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon
      - name: Run host regression checks
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/kotlin" kotlin-compiler@1.9.24
          export PATH="$RUNNER_TEMP/kotlin/node_modules/kotlin-compiler/bin:$PATH"
          tests/run-job-progress.sh
          ant_jar=$(find "$HOME/.gradle/caches/modules-2/files-2.1/org.apache.ant/ant/1.10.15" -name 'ant-1.10.15.jar' -print -quit)
          test -n "$ant_jar"
          tests/run-kokoro-files.sh "$ant_jar"
          tests/run-signing.sh
