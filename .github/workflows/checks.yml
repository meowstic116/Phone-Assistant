name: Android checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PR_NUM: ${{ github.event.pull_request.number || 0 }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check tool versions agree
        run: bash tests/check-tool-versions.sh
      - name: Build debug and unsigned tester APKs
        run: |
          set -euo pipefail
          fail() {
            echo "## $1 failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -60 "$RUNNER_TEMP/step.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=$1::$(grep -E '^e: |error: |What went wrong' -A2 "$RUNNER_TEMP/step.log" | grep -E '^e: |error: ' | head -8 | tr '\n' '|' | cut -c1-2000)"
            exit 1
          }
          ./gradlew --version 2>&1 | tee "$RUNNER_TEMP/step.log" || fail "Gradle wrapper"
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/step.log" || fail "Build"
      - name: Lint
        run: |
          set -euo pipefail
          ./gradlew :app:lint --no-daemon 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { echo "## Lint failed" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -50 "$RUNNER_TEMP/step.log" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; echo "::error title=Lint::$(grep -E 'Error: |error: |^e: |Lint found|Exception|FAILED' "$RUNNER_TEMP/step.log" | head -6 | tr '\n' '|' | cut -c1-1800)"; { echo "### Lint failure log (auto)"; echo '```'; tail -20 "$RUNNER_TEMP/step.log"; echo '```'; echo '<details><summary>Full lint report</summary>'; echo '```'; cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt 2>/dev/null || cat app/build/reports/lint-results-debug.txt 2>/dev/null; echo '```'; echo '</details>'; } > "$RUNNER_TEMP/comment.md"; gh pr comment "$PR_NUM" --body-file "$RUNNER_TEMP/comment.md" || true; exit 1; }
      - name: Unit tests (screen builds under Robolectric)
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { echo "## Unit tests failed" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -80 "$RUNNER_TEMP/step.log" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; echo "::error title=Unit tests::$(grep -E '^e: |error: |FAILED|Exception' "$RUNNER_TEMP/step.log" | head -6 | tr '\n' '|' | cut -c1-1800)"; { echo "### Unit test failure log (auto)"; echo '```'; tail -45 "$RUNNER_TEMP/step.log"; echo '```'; } > "$RUNNER_TEMP/comment.md"; gh pr comment "$PR_NUM" --body-file "$RUNNER_TEMP/comment.md" || true; exit 1; }
      - name: Run host regression checks
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/kotlin" kotlin-compiler@1.9.24
          export PATH="$RUNNER_TEMP/kotlin/node_modules/kotlin-compiler/bin:$PATH"
          tests/run-job-progress.sh
          tests/run-kokoro-files.sh
          tests/run-signing.sh
          tests/run-settings-layout.sh
