name: Android checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check tool versions agree
        run: bash tests/check-tool-versions.sh
      - name: Build debug and unsigned tester APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon
      - name: Lint
        run: ./gradlew :app:lint --no-daemon
      - name: Unit tests (screen builds under Robolectric)
        run: ./gradlew :app:testDebugUnitTest --no-daemon
      - name: Run host regression checks
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/kotlin" kotlin-compiler@1.9.24
          export PATH="$RUNNER_TEMP/kotlin/node_modules/kotlin-compiler/bin:$PATH"
          tests/run-job-progress.sh
          tests/run-kokoro-files.sh
          tests/run-signing.sh
          tests/run-settings-layout.sh
