name: Android checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check tool versions agree
        run: bash tests/check-tool-versions.sh
      - name: Build debug and unsigned tester APKs
        run: |
          set -euo pipefail
          fail() {
            echo "## $1 failed" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -60 "$RUNNER_TEMP/step.log" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          ./gradlew --version 2>&1 | tee "$RUNNER_TEMP/step.log" || fail "Gradle wrapper"
          ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/step.log" || fail "Build"
      - name: Lint
        run: |
          set -euo pipefail
          ./gradlew :app:lint --no-daemon 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { echo '## Lint failed' >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -60 "$RUNNER_TEMP/step.log" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1; }
      - name: Unit tests (screen builds under Robolectric)
        run: |
          set -euo pipefail
          ./gradlew :app:testDebugUnitTest --no-daemon 2>&1 | tee "$RUNNER_TEMP/step.log" \
            || { echo '## Unit tests failed' >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; tail -80 "$RUNNER_TEMP/step.log" >> "$GITHUB_STEP_SUMMARY"; echo '```' >> "$GITHUB_STEP_SUMMARY"; exit 1; }
      - name: Run host regression checks
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund --prefix "$RUNNER_TEMP/kotlin" kotlin-compiler@1.9.24
          export PATH="$RUNNER_TEMP/kotlin/node_modules/kotlin-compiler/bin:$PATH"
          tests/run-job-progress.sh
          tests/run-kokoro-files.sh
          tests/run-signing.sh
          tests/run-settings-layout.sh
