name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Build APK
        run: |
          set -euo pipefail
          ./gradlew assembleRelease --no-daemon
          mv app/build/outputs/apk/release/app-release.apk "phone-assistant-${GITHUB_REF_NAME}.apk"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: phone-assistant-*.apk

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" "phone-assistant-${GITHUB_REF_NAME}.apk" \
            --title "Phone Assistant $GITHUB_REF_NAME" \
            --generate-notes
